[terminal.shell]
program = "/opt/homebrew/bin/fish"

[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 10

decorations = "Buttonless"

opacity = 0.9
blur = true

option_as_alt = "Both"

[font]
normal.family = "SFMono Nerd font"
size = 20

[general]
import = [
  "~/.config/alacritty/themes/themes/tokyo-night-storm.toml"
]
